map $http_time_zone $is_utc8 {
    default       0;
    "UTC+8"       1;
}
server {
    listen 443 ssl;
    http2 on;
    server_name nacos.yzkj.com;

    # 证书和私钥文件路径
    ssl_certificate /etc/nginx/ssl/h5buy.pem;
    ssl_certificate_key /etc/nginx/ssl/h5buy.key;

    # 优化配置（可选，但推荐）
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'EECDH+AESGCM:EDH+AESGCM:AES256+EECDH:AES256+EDH';
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # 开启 OCSP Stapling，提高性能
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver_timeout 5s;

    gzip  on;
    gzip_min_length  1k;
    gzip_buffers     4 16k;
    gzip_http_version 1.1;
    gzip_comp_level 6;
    gzip_types       text/plain application/x-javascript text/css application/xml text/javascript application/x-httpd-php application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";
    gzip_vary on;
    resolver 8.8.8.8;


    index index.htm index.html ;
    root /usr/share/nginx/html/h5_buy;
    error_log /var/nginx/log/error.log;
    access_log /var/nginx/log/acces.log;

    error_page 500 502 503 504 /50x.html;
    location = /50x.html {
      root html;
    }
    location / {
        port_in_redirect on;
        proxy_pass http://127.0.0.1:8080/;
        proxy_redirect  off;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        proxy_set_header X-NginX-Proxy true;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "Upgrade";
        proxy_connect_timeout 600s;
        proxy_read_timeout 600;
        proxy_send_timeout 600s;
    }
}
